syntax = "proto3";
package test2;
option go_package = ".;test2";

import "github.com/hezof/protoapi.proto";

enum Enum {
  null = 0[deprecated = true]; one = 1; two = 2;
}

service Demo {

  option (protoapi.http_only) = true;

  option (protoapi.tag) = {
    name: "Demo测试",
    desc: "这是一个Demo测试",
  };

  rpc Simple(Req) returns (Rsp){
    option (protoapi.http) = {
      name: "Simple",
      desc: "简单RPC",
      get: "/demo/simple/:id",
      body: omit,
    };
    option (protoapi.role) = {
      code: 101,
      name: "101",
      desc: "需要101角色",
    };
  }

  rpc Client(stream Req) returns (Rsp){
    option (protoapi.http) = {
      name: "Client",
      desc: "Streaming Client",
      post: "/demo/client/:id",
      head: "/demo/client/:id",
      body: json,
    };
    option (protoapi.role) = {
      code: 102,
      name: "102",
      desc: "需要102角色",
    };
  }
  rpc Server(Req) returns (stream Rsp){
    option (protoapi.http) = {
      name: "Server",
      desc: "Streaming Server",
      post: "/demo/server/:id",
      head: "/demo/server/:id",
      body: json,
    };
    option (protoapi.role) = {
      code: 102,
      name: "102",
      desc: "需要102角色",
    };
  }
  rpc Bidirectional(stream Req) returns (stream Rsp){
    option (protoapi.http) = {
      name: "Server",
      desc: "Streaming Server",
      post: "/demo/Bidirectional/:id",
      head: "/demo/Bidirectional/:id",
      body: json,
    };
    option (protoapi.role) = {
      code: 102,
      name: "102",
      desc: "需要102角色",
    };
  }
}

message Req {
  repeated string id = 1 [
    (protoapi.prop) = {
      name: "id",
      desc: "主键字段",
      escape_html: true,
      in: body,
      style: simple,
    },
    (protoapi.rule) = {
      required: {
        status: 403,
        code: 1001,
        name: "required",
        message: "必需",
      },
    }];
  optional string name = 2 [
    (protoapi.prop) = {
      name: "name",
      desc: "名称字段",
      escape_html: true,
      in: body,
      style: simple,
    },
    (protoapi.rule) = {
      enum: {
        val: 'a,b,c',
        err: {
          status: 403,
          code: 1001,
          name: "required",
          message: "必需",
        }
      }
    }];
  map<string, int32> scores = 3;
}

enum Sex{
  None = 0;
  Male = 1;
  Female = 2;
}

message Rsp {
  int64 weight = 2 [(protoapi.prop) = {desc: "体重"}];
}